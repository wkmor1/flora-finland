finbifID: MX.37762
vernacularName: True ladyferns
scientificName: Athyrium
taxonRank: genus
description: Ferns with stipes that have adaxial grooves, two vascular bundles and
  are scaly at the base. Blade segments are inequilateral at base. Groove of rachis
  continuous to grooves of costae and costules. Veins free and extending to tooth
  tips at lamina margin.
sources:
