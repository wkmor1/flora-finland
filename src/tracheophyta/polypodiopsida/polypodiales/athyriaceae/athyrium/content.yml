finbifID: MX.37762
vernacularName: True ladyferns
scientificName: Athyrium
taxonRank: genus
description: Ferns with _stipe_s that have _adaxial_ grooves, two _vascular bundle_s and
  are _scaly[scale]_ at the base. _Blade_ segments are asymmetrical at their bases. Groove of _rachis_
  continuous to grooves of _costa_e and _costule_s. _Vein_s _free[free veins]_ and extending to toothed
  tips at the _blade_ margin.
