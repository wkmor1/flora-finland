vernacularName: Cliff ferns
scientificName: Woodsiaceae
taxonRank: family
images:
- file: img0.jpeg
  src: https://www.inaturalist.org/photos/428947720
  alt: Rusty woodsia (Woodsia ilvensis) growing in Alppila, Helsinki
  caption: <span class="species">Woodsia ilvensis</span> (Alppila, Helsinki)
description:  Ferns with blackish wiry roots. _Rhizome_s bear _lanceolate_
  non-_clathrate_ _scale_s. _Stipe_s have crescent-shaped _vascular bundles_
  that unite towards the base of the _blade_ to form a U-shape in cross-section.
  Their _vein_s branch from the _midvein_ and do not unite to form a network.
  Veins terminate before reaching the leaf margin. _Sori[sorus]_ are round and
  have _indusia[indusium]_ that arise from the base of the
  _sporangia[sporangium]_ and often divided into segments or filaments.
  _Spores_ are _monolete_.
sources:
