- term: Vascular tissue
  definition: A cellular assembly for transporting water and nutrients, the
    major components of which are _xylem_ and _phloem_.
- term: Sporophyte
  definition: The asexual _spore_-producing multicellular stage in the
    life cycle of plants and most algae. The alternate life cycle stage is the
    _gametophyte_.
- term: Megaphyllous
  definition: Having _megaphyll_s or reduced structures derived from megaphylls.
- term: Megaphyll
  definition: A type of plant leaf that has multiple _vein_s, the other type
    being a _microphyll_.
- term: Xylem
  definition: A type of plant tissue that transports water and soluble mineral
    nutrients.
- term: Phloem
  definition: A type of plant tissue that transports soluble organic compounds
    made by a plant by photosynthesising.
- term: Spore
  definition: Plant cells that are produced by a _sporophyte_ that go on to
    germinate into a _gametophyte_.
- term: Vein
  definition: The major regions of a plant leaf occupied by _vascular tissue_.
- term: Microphyll
  definition:  A type of plant leaf that has a single _vein_s, the other type
    being a _macrophyll_.
- term: Gametophyte
  definition: The sexual _gamete_-producing multicellular stage in the
    life cycle of plants and most algae. The alternate life cycle stage is the
    _sporophyte_.
- term: Perennial
  definition: Plants that typically live for three or more years.
- term: Sporangium
  definition: The _spore_-producing structure of a _sporophyte_.
- term: Annulus
  definition: A single layer of cells on the exterior of a _sporangium_.
- term: Sporangial stalk
  definition: A thin structure connecting the base of a _sporangium_ to a
    _sporophyte_.
- term: Sporangial Stomium
  definition: The cells in the region of the _sporangium_ that opens so that the
    _spore_s are released.
- term: Stipe
  definition: The thin base of a _frond_ connecting the _blade_ to the rest of
    the fern.
- term: Vascular bundle
  definition: An arrangment of _vascular tissue_ within a plant.
- term: Blade
  definition: The flattened upper part of a _frond_.
- term: Sorus
  definition: A cluster of _sporangia[sporangium]_.
- term: Indusium
  definition: A layer of thin tissue forming a cover over a _sorus_.
- term: Elongate
  definition: Long and narrow.
- term: Gamete
  definition: A _haploid_ cell which fuses with another haploid cell as a
    result of sexual reproduction.
- term: Haploid
  definition: Having the number of chromosomes in a cell typical of a _gamete_.
- term: Frond
  definition: A _megaphyll_ of a fern.
- term: Rhizome
  definition: A plant stem that grows parallel to the growing medium or surface
   from which roots and shoots emerge.
- term: Lancelolate
  definition: Long, narrow, wider at the base than at the middle and tapering to
    a point at the top.
- term: Fern scale
  definition: A thin surface structure on a _frond_ or _rhizome_ that is more
   than one cell wide.
